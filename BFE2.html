<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Light/Dark Mode</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#2c2c2c;
    
    color:white;
    transition:0.4s;
}

header{
    height:70px;
    background:#37d5f2;
    display:flex;
    align-items:center;
    padding:0 20px;
}

button{
    padding:10px 25px;
    border:3px solid white;
    border-radius:10px;
    background:transparent;
    color:white;
    font-size:18px;
    cursor:pointer;
}

main{
    height:420px;
    background:#333;
    padding:20px;
    font-size:22px;
}

footer{
    height:60px;
    background:#37d5f2;
    display:flex;
    align-items:center;
    padding-left:20px;
    font-size:18px;
}

/* Light Mode */
.light{
    background:white;
    color:black;
}

.light main{
    background:#f5f5f5;
    color:black;
}

.light header,
.light footer{
    background:#37d5f2;
}

.light button{
    color:black;
    border-color:black;
}
</style>

</head>
<body>

<header>
    <button onclick="toggleMode()">Light</button>
</header>

<main>
    <h3>Main</h3>
</main>

<footer>
    Footer
</footer>

<script>
function toggleMode() {
    document.body.classList.toggle("light");

    const btn = document.querySelector("button");

    if(document.body.classList.contains("light")){
        btn.innerHTML = "Dark";
    } else {
        btn.innerHTML = "Light";
    }
}
</script>

</body>
</html>
