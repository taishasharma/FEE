<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boxes2</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            min-height: 100dvh;
            background-color:navy;
        }
    </style>
</head>
<body>
    <section style="
        height:250px; 
        width:250px;
        padding: 20px;
        margin: 20px;
        background-color:lightblue;
        color: white;
        border: 1px white solid;
        box-shadow:0px 5px 10px rgba(0,0,0,0.3);
        text-align:center;"> 
        BOX 1
    </section>
    
    <section style="
        height:250px; 
        width:250px;
        padding: 20px;
        margin: 20px;
        background-color:pink;
        color: white;
        border: 1px white solid;
        box-shadow: 0px 5px 10px rgba(0,0,0,0.3);
        text-align:center;">
        BOX 2
    </section>
    
</body>
</html>
