<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Boxs</title>
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    background:#171515;
    font-family:Arial, sans-serif;
}

.container{
    width:700px;
    height:400px;
    border:2px solid #fff9f9;
    position:relative;
}

.box{
    width:120px;
    height:60px;
    background:#6ea8ff;
    border-radius:10px;
    position:absolute;
    text-align:center;
    line-height:60px;
    font-weight:bold;
    color:white;
}


.box1{
    top:50px;
    left:50%;
    transform:translateX(-50%);
}


.box2{
    top:140px;
    left:220px;
}


.box3{
    top:140px;
    right:220px;
}


.box4{
    top:230px;
    left:50%;
    transform:translateX(-50%);
}
</style>
</head>
<body>
<div class="container">
    <div class="box box1"></div>
    <div class="box box2"></div>
    <div class="box box3"></div>
    <div class="box box4"></div>
</div>
</body>
</html>
