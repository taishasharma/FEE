<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            min-height:100dvh;
            padding:1rem;
            display:flex;
            flex-direction: column;
            gap:0.5rem;
        }
        .box{
            padding:1rem;
            height:7rem;
            width:14rem;
            border:1px solid;
            border-radius:5px;
        }
        .bg1{
            background-color: blue;
            color:white;
        }

        .bg2{
            background-color: blue;
            color:white;
        }
    </style>
</head>
<body>
    <section id="a" class="box bg 1">Section 1</section>
    <script type="text/javascript" src="dom.js"></script>

    <section id="b" class="box bg 2">Section 2</section>
    <script type="text/javascript" src="dom.js"></script>
</body>
</html>
