<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CIRCLES</title>
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    display:flex;
    justify-content:center;
    align-items:flex-start;
    min-height:100vh;
    background:rgb(127, 136, 255);
    padding-top:50px;  
}

.container{
    width:90%;
    max-width:1500px;
    height:300px;
    background:white;
    display:flex;
    justify-content:center;
    align-items:center;
}

.circles{
    display:flex;
}

.circle{
    width:180px;
    height:180px;
    border:4px solid black;
    border-radius:50%;
}

#c2{
    margin-left:-90px;
}

#c3{
    margin-left:-90px;
}
</style>
</head>

<body>
<div class="container">
    <div class="circles">
        <div class="circle" id="c1"></div>
        <div class="circle" id="c2"></div>
        <div class="circle" id="c3"></div>
    </div>
</div>
</body>
</html>
