<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Centered Boxes</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: black;
        }

        .container {
            display: grid;
            grid-template-columns: repeat(2, 250px);
            gap: 20px;
        }

        .box {
            height: 130px;
            background-color:blue;
            border: 2px solid white;
            border-radius: 10px;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font: bold 20px Arial;
        }

        .box1 {
            grid-column: 1 / 3;
            justify-self: center;
            width: 250px;
        }

        .box4 {
            grid-column: 1 / 3;
            justify-self: center;
            width: 250px;
        }
    </style>
</head>

<body>
    <main class="container">
        <section class="box box1">Box 1</section>
        <section class="box">Box 2</section>
        <section class="box">Box 3</section>
        <section class="box box4">Box 4</section>
    </main>
</body>
</html>
