<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="Author" content="Dhruv Pathak">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="">
    <title>GRID-2(bento grid)</title>
    <style>

        *{
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
        }
        
        body{
            min-height: 100dvh;
            font-family: 'Courier New', Courier, monospace;
            font-size: 16px;
            background-color: white;
        }

        section{
            padding: 10px;
        }

        .box{
            background-color: rgb(0, 255, 251);
            padding: 1rem;
        }

        .gc{
            display: grid;
            gap: 0.5rem;
            /*specify width of columns*/
            grid-template-columns: repeat(3,150px);
            /*specify height of rows*/
            grid-template-rows: repeat(3,150px);
            /*centers the grid*/
            place-content: center;
        }

        #m1{
            grid-column-start: 1;
            grid-column-end: 3;
            /*grid-column: 1/3;*/

            grid-row-start: 1;
            grid-row-end: 2;
            /*grid-row: 1/2;*/
        }

        #m2{
            grid-column-start: 3;
            grid-column-end: 4;
            /*grid-column: 3/4;*/

            grid-row-start: 1;
            grid-row-end: 3;
            /*grid-row: 1/3;*/
        }

         #m3{
            grid-column-start: 1;
            grid-column-end: 2;
            /*grid-column: 1/2;*/

            grid-row-start: 2;
            grid-row-end: 4;
            /*grid-row: 2/4;*/
        }

         #m5{
            grid-column-start: 2;
            grid-column-end: 4;
            /*grid-column: 2/4;*/
            
            grid-row-start: 3;
            grid-row-end: 4;
            /*grid-row: 3/4;*/
        }

         @media (min-width: 360px){
        .gc{
            /* grid-template-columns: repeat(3,150px);*/
            grid-template-columns: 150px 150px 150px;
            /* grid-template-rows: repeat(3,150px);*/
            grid-template-rows: 150px 150px 150px;
        }
        }

        @media (min-width: 767px){
        .gc{
            /* grid-template-columns: repeat(3,250px);*/
            grid-template-columns: 250px 250px 250px;
            /* grid-template-rows: repeat(3,150px);*/
            grid-template-rows: 150px 150px 150px;
        }
        }

        @media(min-width: 1024px){
        .gc{
            /* grid-template-columns: repeat(3,350px);*/
            grid-template-columns: 350px 350px 350px;
            /* grid-template-rows: repeat(3,150px);*/
            grid-template-rows: 150px 150px 150px;
        }
        }

    </style>
</head>
<body>
<section class="box" style="height: 10vh;">
        <span style="font-size: 2.5rem;
                     margin-right: 1rem;">&#9812</span>
        Header/NavBar
    </section>
    <section class="box gc"
             style="height: 80vh;
                    background-color: white;">
    <main class="box" id="m1">Content-1</main>
    <main class="box" id="m2">Content-2</main>
    <main class="box" id="m3">Content-3</main>
    <main class="box" id="m4">Content-4</main>
    <main class="box" id="m5">Content-5</main>
    </section>
    <section class="box"
             style="position: absolute;
                    bottom: 0px;
                    left: 0px;
                    height: 10vh;
                    width: 100%;">
            <span style="font-size: 1.5rem;
                     margin-right: 1rem;">&#9776</span>
        Footer
    </section>
</body>
</html>
